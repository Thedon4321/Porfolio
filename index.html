  <body>
    <div id="root"></div>
    <!--
      Netlify Forms detection stub (build-time). Runtime submits via fetch in ContactForm
      when VITE_CONTACT_PROVIDER=netlify. No secrets here.
    -->
    <form
      name="portfolio-contact"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
